<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Code 사용량</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23d97757'/%3E%3Crect x='3' y='8' width='2' height='5' fill='white'/%3E%3Crect x='7' y='5' width='2' height='8' fill='white'/%3E%3Crect x='11' y='3' width='2' height='10' fill='white'/%3E%3C/svg%3E" />
<script src="/vendor/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e8ee; --muted: #8b93a7;
    --accent: #d97757; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .spacer { flex: 1; }
  nav { display: flex; gap: 4px; }
  nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 8px; }
  nav a.on { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  button.toggle { background: var(--panel); color: var(--text); border: 1px solid var(--line);
                  border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  main { padding: 20px 24px; display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); max-width: 1400px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .card h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 12px; }
  .kpi { grid-column: span 3; }
  .kpi .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .w4 { grid-column: span 4; } .w5 { grid-column: span 5; } .w7 { grid-column: span 7; }
  .w8 { grid-column: span 8; } .w12 { grid-column: span 12; }
  @media (max-width: 1000px) { .kpi { grid-column: span 6; } .w4, .w5, .w7, .w8 { grid-column: span 12; } }
  @media (max-width: 560px) { main { padding: 16px; } .kpi { grid-column: span 12; } }
  .chart { position: relative; height: 260px; }
  .budget { margin-bottom: 14px; }
  .budget .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .budget .name { font-weight: 600; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; transition: width .4s; }
  .lbl { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.r, th.r { text-align: right; }
  .tbl { overflow-x: auto; max-height: 380px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--line); }
  .alert { padding: 8px 10px; border-left: 3px solid var(--warn); background: #1d1a12; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
  .alert.bad { border-color: var(--bad); background: #22141a; }
  .alert time { color: var(--muted); font-size: 12px; display: block; }
  .empty { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px;
          padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .chip.off { color: var(--muted); text-decoration: line-through; opacity: .55; }
  #toast { position: fixed; right: 20px; bottom: 20px; max-width: 360px; padding: 12px 14px; border-radius: 10px;
           background: #22141a; border: 1px solid var(--bad); display: none; z-index: 10; }
</style>
</head>
<body>
<header>
  <h1>Claude Code 사용량</h1>
  <nav><a href="/" class="on">개요</a><a href="/usage.html">사용량 분석</a><a href="/openai.html">OpenAI (crpg)</a></nav>
  <span class="live"><span id="dot" class="dot"></span><span id="liveText">연결 중…</span></span>
  <span class="spacer"></span>
  <button class="toggle" id="currencyBtn">원화로 보기</button>
</header>

<main>
  <div class="card kpi"><h2>오늘 비용</h2><div class="v" id="kToday">-</div><div class="s" id="kTodaySub"></div></div>
  <div class="card kpi"><h2>이번 달 비용</h2><div class="v" id="kMonth">-</div><div class="s" id="kMonthSub"></div></div>
  <div class="card kpi"><h2>오늘 토큰</h2><div class="v" id="kTokens">-</div><div class="s" id="kTokensSub"></div></div>
  <div class="card kpi"><h2>오늘 요청 수</h2><div class="v" id="kReq">-</div><div class="s" id="kReqSub"></div></div>

  <div class="card w12"><h2>표시할 프로젝트 (눌러서 빼기·넣기 — 전체 합계에는 그대로 포함)</h2><div class="chips" id="projectToggles"></div></div>

  <div class="card w8"><h2>일별 비용 (프로젝트별, 최근 30일)</h2><div class="chart"><canvas id="dailyChart"></canvas></div></div>
  <div class="card w4"><h2>예산</h2><div id="budgets"></div></div>

  <div class="card w7"><h2>최근 24시간 (시간별)</h2><div class="chart"><canvas id="hourlyChart"></canvas></div></div>
  <div class="card w5"><h2>이번 달 모델별 비용</h2><div class="chart"><canvas id="modelChart"></canvas></div></div>

  <div class="card w8"><h2>최근 요청</h2><div class="tbl"><table id="recent"></table></div></div>
  <div class="card w4"><h2>예산 알림 기록</h2><div id="alerts"></div></div>
</main>

<div id="toast"></div>

<script>
const PALETTE = ["#d97757", "#4f8cff", "#3fb950", "#c678dd", "#d29922", "#2bb3b3", "#f85149", "#8b93a7"];
const WARN_RATIO = 0.8;
const POLL_FALLBACK_MS = 30000;
const REFRESH_DEBOUNCE_MS = 400;
const TOAST_MS = 8000;

let useKrw = false;
let krwPerUsd = 1400;
const projectColor = new Map();
const charts = {};
// Projects the viewer hid (per browser; usage.html reads the same key).
const HIDDEN_KEY = "hiddenProjects";
const hidden = new Set((() => { try { return JSON.parse(localStorage.getItem(HIDDEN_KEY) || "[]"); } catch { return []; } })());
const shown = p => !hidden.has(p);
function toggleProject(p) {
  hidden.has(p) ? hidden.delete(p) : hidden.add(p);
  try { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hidden])); } catch {}
  render();
}

Chart.defaults.color = "#8b93a7";
Chart.defaults.borderColor = "#262b36";
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;

function colorFor(name) {
  if (!projectColor.has(name)) projectColor.set(name, PALETTE[projectColor.size % PALETTE.length]);
  return projectColor.get(name);
}
function money(usd) {
  if (useKrw) return Math.round(usd * krwPerUsd).toLocaleString("ko-KR") + "원";
  return "$" + usd.toFixed(usd > 0 && usd < 1 ? 3 : 2);
}
function tokens(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(n);
}
function scopeName(s) { return s === "global" ? "전체" : s; }
function alertTitle(a) {
  if (a.scope === "limit") return `<b>${a.period === "five_hour" ? "5시간 한도" : "주간 한도"}</b> ${Math.round(a.threshold * 100)}% 도달`;
  return `<b>${esc(scopeName(a.scope))}</b> ${a.period === "daily" ? "일일" : "월간"} 예산 ${Math.round(a.threshold * 100)}% 도달`;
}
function alertDetail(a) {
  return a.scope === "limit" ? `현재 ${Math.round(a.spent)}% 사용` : `${money(a.spent)} / ${money(a.budget)}`;
}
function alertKeyLabel(a) {
  return a.scope === "limit" ? `${fmtTime(Number(a.period_key))} 리셋` : esc(a.period_key);
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function fmtTime(ts) { return new Date(ts).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }); }

function upsertChart(id, config) {
  if (charts[id]) {
    charts[id].data = config.data;
    charts[id].options = config.options;
    charts[id].update("none");
  } else {
    charts[id] = new Chart(document.getElementById(id), config);
  }
}

function budgetBar(label, spent, limit) {
  if (!limit) return `<div class="lbl">${label}: ${money(spent)} (예산 없음)</div>`;
  const ratio = spent / limit;
  const color = ratio >= 1 ? "var(--bad)" : ratio >= WARN_RATIO ? "var(--warn)" : "var(--ok)";
  return `<div class="lbl">${label}: ${money(spent)} / ${money(limit)} · ${Math.round(ratio * 100)}%</div>
          <div class="bar"><i style="width:${Math.min(ratio, 1) * 100}%;background:${color}"></i></div>`;
}

function renderSummary(s) {
  krwPerUsd = s.krwPerUsd || krwPerUsd;
  const t = s.today, m = s.month;
  document.getElementById("kToday").textContent = money(t.cost);
  document.getElementById("kTodaySub").textContent = s.now.day;
  document.getElementById("kMonth").textContent = money(m.cost);
  document.getElementById("kMonthSub").textContent = `${s.now.month} · 요청 ${m.requests.toLocaleString()}건`;
  const todayTok = t.input + t.output + t.cacheRead + t.cacheCreation;
  document.getElementById("kTokens").textContent = tokens(todayTok);
  document.getElementById("kTokensSub").textContent =
    `입력 ${tokens(t.input)} · 출력 ${tokens(t.output)} · 캐시읽기 ${tokens(t.cacheRead)}`;
  document.getElementById("kReq").textContent = t.requests.toLocaleString();
  document.getElementById("kReqSub").textContent = t.requests ? `평균 ${money(t.cost / t.requests)}/요청` : "";

  document.getElementById("budgets").innerHTML = s.budgets.filter(b => b.scope === "global" || shown(b.scope)).map(b => `
    <div class="budget">
      <div class="row"><span class="name"><span class="tag" style="background:${b.scope === "global" ? "var(--line)" : colorFor(b.scope)}33">${esc(scopeName(b.scope))}</span></span></div>
      ${budgetBar("오늘", b.daily.spent, b.daily.limit)}
      ${budgetBar("이번 달", b.monthly.spent, b.monthly.limit)}
    </div>`).join("");

  document.getElementById("alerts").innerHTML = s.alerts.length
    ? s.alerts.map(a => `
      <div class="alert ${a.threshold >= 0.95 ? "bad" : ""}">
        ${alertTitle(a)} — ${alertDetail(a)}
        <time>${fmtTime(a.ts)} · ${alertKeyLabel(a)}</time>
      </div>`).join("")
    : `<div class="empty">아직 알림이 없어요.</div>`;

  const models = s.byModel;
  upsertChart("modelChart", {
    type: "doughnut",
    data: {
      labels: models.map(x => x.model),
      datasets: [{ data: models.map(x => x.cost), backgroundColor: models.map((_, i) => PALETTE[(i + 1) % PALETTE.length]), borderWidth: 0 }],
    },
    options: {
      maintainAspectRatio: false, cutout: "62%",
      plugins: {
        legend: { position: "right", labels: { boxWidth: 10 } },
        tooltip: { callbacks: { label: c => `${c.label}: ${money(c.raw)}` } },
      },
    },
  });
}

function renderTimeseries(ts) {
  const projects = [...new Set(ts.daily.map(d => d.project))].filter(shown).sort();
  const idx = new Map(ts.days.map((d, i) => [d, i]));
  const datasets = projects.map(p => {
    const data = new Array(ts.days.length).fill(0);
    for (const r of ts.daily) if (r.project === p && idx.has(r.day)) data[idx.get(r.day)] += r.cost;
    return { label: p, data, backgroundColor: colorFor(p), borderRadius: 3, stack: "cost" };
  });
  upsertChart("dailyChart", {
    type: "bar",
    data: { labels: ts.days.map(d => d.slice(5)), datasets },
    options: {
      maintainAspectRatio: false,
      scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { callback: v => money(v) } } },
      plugins: {
        // Chart.js's own legend hiding is lost on every redraw (each usage event), so a click hides the project for good.
        legend: { labels: { boxWidth: 10 }, onClick: (_e, item) => toggleProject(item.text) },
        tooltip: { mode: "index", callbacks: { label: c => `${c.dataset.label}: ${money(c.raw)}` } },
      },
    },
  });

  const hIdx = new Map(ts.hours.map((h, i) => [h, i]));
  const hCost = new Array(ts.hours.length).fill(0);
  const hTok = new Array(ts.hours.length).fill(0);
  for (const r of ts.hourly) if (hIdx.has(r.hour)) { hCost[hIdx.get(r.hour)] = r.cost; hTok[hIdx.get(r.hour)] = r.tokens; }
  upsertChart("hourlyChart", {
    type: "line",
    data: {
      labels: ts.hours.map(h => h.slice(11) + "시"),
      datasets: [
        { label: "비용", data: hCost, borderColor: "#d97757", backgroundColor: "#d9775722", fill: true, tension: .3, yAxisID: "y" },
        { label: "토큰", data: hTok, borderColor: "#4f8cff", borderDash: [4, 4], tension: .3, yAxisID: "y1", pointRadius: 0 },
      ],
    },
    options: {
      maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      scales: {
        x: { grid: { display: false } },
        y: { position: "left", ticks: { callback: v => money(v) } },
        y1: { position: "right", grid: { display: false }, ticks: { callback: v => tokens(v) } },
      },
      plugins: {
        legend: { labels: { boxWidth: 10 } },
        tooltip: { callbacks: { label: c => c.dataset.yAxisID === "y" ? `비용: ${money(c.raw)}` : `토큰: ${tokens(c.raw)}` } },
      },
    },
  });
}

function renderRecent(rows) {
  rows = rows.filter(r => shown(r.project));
  const head = `<tr><th>시각</th><th>프로젝트</th><th>모델</th><th class="r">입력</th><th class="r">출력</th>
                <th class="r">캐시읽기</th><th class="r">비용</th><th class="r">소요</th></tr>`;
  document.getElementById("recent").innerHTML = head + (rows.length ? rows.map(r => `
    <tr>
      <td>${fmtTime(r.ts)}</td>
      <td><span class="tag" style="background:${colorFor(r.project)}33">${esc(r.project)}</span></td>
      <td>${esc(r.model)}</td>
      <td class="r">${tokens(r.input_tokens)}</td>
      <td class="r">${tokens(r.output_tokens)}</td>
      <td class="r">${tokens(r.cache_read_tokens)}</td>
      <td class="r">${money(r.cost_usd)}</td>
      <td class="r">${(r.duration_ms / 1000).toFixed(1)}s</td>
    </tr>`).join("") : `<tr><td colspan="8" class="empty">아직 데이터가 없어요. Claude Code를 한 번 사용해 보세요.</td></tr>`);
}

let lastData = null;
async function refresh() {
  try {
    const [summary, ts, recent] = await Promise.all([
      fetch("/api/summary").then(r => r.json()),
      fetch("/api/timeseries?days=30").then(r => r.json()),
      fetch("/api/recent?limit=50").then(r => r.json()),
    ]);
    lastData = { summary, ts, recent };
    render();
  } catch (e) { console.error(e); }
}
function render() {
  if (!lastData) return;
  // 프로젝트 색을 항상 같은 순서로 배정
  [...new Set(lastData.summary.budgets.map(b => b.scope).filter(s => s !== "global"))].sort().forEach(colorFor);
  const all = [...new Set([...lastData.summary.budgets.map(b => b.scope).filter(s => s !== "global"), ...lastData.ts.daily.map(d => d.project)])].sort();
  const box = document.getElementById("projectToggles");
  box.innerHTML = all.map(p => `<button class="chip ${shown(p) ? "" : "off"}" aria-pressed="${shown(p)}" data-p="${esc(p)}">${esc(p)}</button>`).join("");
  box.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => toggleProject(b.dataset.p)));
  renderSummary(lastData.summary);
  renderTimeseries(lastData.ts);
  renderRecent(lastData.recent);
}

let refreshTimer = null;
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refresh, REFRESH_DEBOUNCE_MS);
}

function showToast(a) {
  const el = document.getElementById("toast");
  el.innerHTML = `⚠️ ${alertTitle(a)}<br>${alertDetail(a)}`;
  el.style.display = "block";
  setTimeout(() => (el.style.display = "none"), TOAST_MS);
  if ("Notification" in window && Notification.permission === "granted") {
    new Notification("Claude Code 알림", { body: `${alertTitle(a).replace(/<[^>]+>/g, "")} · ${alertDetail(a)}` });
  }
}

function connect() {
  const es = new EventSource("/api/stream");
  const dot = document.getElementById("dot"), txt = document.getElementById("liveText");
  es.addEventListener("hello", () => { dot.classList.add("on"); txt.textContent = "실시간"; });
  es.addEventListener("usage", scheduleRefresh);
  es.addEventListener("limits", scheduleRefresh);
  es.addEventListener("alert", e => { showToast(JSON.parse(e.data)); scheduleRefresh(); });
  es.onerror = () => { dot.classList.remove("on"); txt.textContent = "재연결 중…"; };
}

document.getElementById("currencyBtn").addEventListener("click", e => {
  useKrw = !useKrw;
  e.target.textContent = useKrw ? "달러로 보기" : "원화로 보기";
  render();
});
document.addEventListener("click", () => {
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}, { once: true });

refresh();
connect();
setInterval(refresh, POLL_FALLBACK_MS);
</script>
</body>
</html>
